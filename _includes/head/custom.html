<!-- Dark mode FOUC prevention - must run before render -->
<script>
  (function() {
    var theme = localStorage.getItem('theme');
    if (theme !== 'light') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
